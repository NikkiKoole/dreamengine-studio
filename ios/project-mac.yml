# xcodegen spec — the MAC CATALYST variant, for hosting our AUv3 in GarageBand/Logic on macOS.
# A SEPARATE spec (and a separate project NAME, so it generates TinyjamMac.xcodeproj and cannot
# clobber the iOS TinyjamHello.xcodeproj) because several agents build the iOS project in this one
# shared tree — an in-place platform edit to project.yml would break them. Driven by ./mac.sh.
#
# WHY Catalyst rather than a native macOS target: every pixel of UI we have is UIKit
# (Sources/CanvasView.swift), and the AUv3 extension already exists and works. Catalyst reuses both
# as-is; a native AppKit target would mean a second host view to maintain forever. The AU itself is
# platform-agnostic C + a render block.
#
# The app is only a CARRIER here. On macOS an AUv3 lives inside an app bundle's PlugIns/ and the
# system registers it when that app is launched once — so "run the app" is a REGISTRATION step, not
# the point. The point is the extension showing up in GarageBand.
name: TinyjamMac
options:
  bundleIdPrefix: com.tinyjam
  deploymentTarget:
    iOS: "15.0"
targets:
  TinyjamMac:
    type: application
    platform: iOS          # + SUPPORTS_MACCATALYST below == build for "My Mac (Mac Catalyst)"
    sources:
      - path: Sources
        excludes: [canvas.c, canvas.h, audio.c, audio.h, Tinyjam.storekit]
      - path: ../runtime/studio.c
      - path: ../runtime/raylib_compat.c
      # gen/mac + gen/macau are OUR OWN staging dirs. The iOS spec uses gen/app + gen/au, and those
      # are shared with whatever iOS build another agent is running in this same tree — borrowing
      # them gave "ld: 3 duplicate symbols" the first time, because gen/app held a multi-cart
      # staging (app_main.c + per-cart TUs) that a single cart.c collides with.
      - path: gen/mac
      - path: gen/Assets.xcassets
        optional: true
    dependencies:
      - target: TinyjamMacAU
        embed: true
      # EMBED the kernel framework, do NOT link it. The app compiles its own copy of the engine
      # (studio.c is in its sources above) and must not also load a second one; it carries the
      # framework purely so the system can find it — an AUv3's code bundle is looked up in the
      # containing app's Frameworks/, and the appex reaches it by rpath. See AU/TinyjamAUKernel.h.
      - target: TinyjamAUKernel
        embed: true
        link: false
    entitlements:
      path: Mac.entitlements
      properties:
        # MANDATORY on macOS: an app extension only loads if it AND its container are sandboxed.
        # Without this the AU registered, appeared in GarageBand's instrument list, and then failed
        # to open with an orange (!) and no crash report — the entitlements were just
        # com.apple.security.get-task-allow (a debug flag). Catalyst requires the sandbox anyway.
        com.apple.security.app-sandbox: true
    settings:
      base:
        SUPPORTS_MACCATALYST: YES
        # Catalyst-only: don't also try to satisfy the iPhone/iPad destinations here.
        SUPPORTED_PLATFORMS: macosx
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tinyjam.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Lets you play your guitar, voice, or any sound live through the effects."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
        HEADER_SEARCH_PATHS: [$(SRCROOT)/../runtime, $(SRCROOT)/gen/mac, $(SRCROOT)/Sources]
        # SCALE=1 keeps UIKit points 1:1 with framebuffer pixels (same reasoning as the iOS spec).
        # Cart dims come from mac.sh on the command line, never baked here.
        GCC_PREPROCESSOR_DEFINITIONS: [$(inherited), DE_NO_RAYLIB=1, SCALE=1]
        # -fno-modules for the C compiles ONLY (Swift keeps modules, it needs them). On the macOS
        # SDK the Darwin CLANG MODULE pulls in curses.h, which declares echo() and filter() — and
        # so does our public API (studio.h), so studio.c failed with "conflicting types for 'echo'".
        # iOS never hit it: there is no curses in the iOS SDK. Renaming our API is not an option
        # (it is in hundreds of carts), and textual includes never reach curses.h at all.
        OTHER_CFLAGS: [-fno-modules]
        MARKETING_VERSION: "1.0"   # MUST match the extension's, or registration can be refused
        CURRENT_PROJECT_VERSION: "1"
  # ── the AU's CODE, in a loadable bundle ────────────────────────────────────────────────────────
  # Everything that used to sit in the appex lives here. The reason is IN-PROCESS LOADING, and it is
  # measured rather than assumed: with the AU code in the .appex (an executable, not a loadable
  # bundle) a host asking for `.loadInProcess` was silently handed an out-of-process instance
  # anyway — which is the case where the view controller builds its own audio unit and the panel
  # ends up driving an engine nobody can hear. Apple's own AUv3 samples and every working
  # third-party AUv3 are shaped this way. Full rationale: AU/TinyjamAUKernel.h.
  TinyjamAUKernel:
    type: framework
    platform: iOS
    sources:
      - AU/TinyjamAU.swift
      - AU/TinyjamAUViewController.swift
      - AU/RateConvert.swift
      # PUBLIC headers, not just compiled ones: the umbrella is how this framework's Swift sees the C
      # engine now that a bridging header is unavailable (frameworks reject them outright).
      - path: AU/TinyjamAUKernel.h
        attributes: [Public]
      - path: Sources/engine.h
        attributes: [Public]
      # The plug-in's VIEW is the SAME CanvasView the standalone app uses (hosted: true switches it to
      # blit-only). AU_EXT keeps the app's AVAudioEngine/mic plumbing out of the extension, which never
      # owns audio — the host does.
      - Sources/CanvasView.swift
      - ../runtime/studio.c
      - ../runtime/raylib_compat.c
      - gen/macau/cart.c
    settings:
      base:
        SUPPORTS_MACCATALYST: YES
        SUPPORTED_PLATFORMS: macosx
        # MANDATORY, and its absence does not read like a missing plist: with no Info.plist the
        # framework builds fine and then CODESIGN fails on Versions/A with "bundle format
        # unrecognized, invalid, or unsuitable". It is also the thing that gives the framework the
        # CFBundleIdentifier that AudioComponentBundle looks it up by, so there is no version of this
        # target that works without it.
        GENERATE_INFOPLIST_FILE: YES
        # This id is what the extension's AudioComponentBundle key names. Change one, change both.
        PRODUCT_BUNDLE_IDENTIFIER: com.tinyjam.mac.AUKernel
        PRODUCT_MODULE_NAME: TinyjamAUKernel
        # The umbrella-header mechanism only works with a module defined.
        DEFINES_MODULE: YES
        # Loaded into an app extension, so it must stay inside the extension-safe API surface — the
        # same restriction the appex itself compiled under before the move.
        APPLICATION_EXTENSION_API_ONLY: YES
        HEADER_SEARCH_PATHS: [$(SRCROOT)/../runtime, $(SRCROOT)/gen/macau, $(SRCROOT)/Sources]
        GCC_PREPROCESSOR_DEFINITIONS: [$(inherited), DE_NO_RAYLIB=1, SCALE=1]
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: [$(inherited), AU_EXT]
        OTHER_CFLAGS: [-fno-modules]   # the curses echo()/filter() collision — see the app target
        MARKETING_VERSION: "1.0"   # MUST match the extension's, or registration can be refused
        CURRENT_PROJECT_VERSION: "1"
  TinyjamMacAU:
    type: app-extension
    platform: iOS
    sources:
      # ONE stub file — see AU/ExtensionStub.swift for why it is not empty. All the real code is in
      # TinyjamAUKernel now.
      - AU/ExtensionStub.swift
    dependencies:
      # LINK, do not embed: the framework ships in the containing app's Frameworks/ (the app embeds
      # it) and this reaches it by the rpath below. Embedding a second copy inside the appex would
      # give the system two bundles with one identifier.
      - target: TinyjamAUKernel
        embed: false
    settings:
      base:
        SUPPORTS_MACCATALYST: YES
        SUPPORTED_PLATFORMS: macosx
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.tinyjam.mac.AU
        # .appex/Contents/MacOS → up 4 → TinyjamMac.app/Contents, i.e. where the app embedded it.
        LD_RUNPATH_SEARCH_PATHS: [$(inherited), "@executable_path/../../../../Frameworks"]
        MARKETING_VERSION: "1.0"   # MUST match the extension's, or registration can be refused
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: MacAU.entitlements
      properties:
        # app-sandbox ONLY. Adding com.apple.security.inherit here moved the failure from
        # OpenAComponent 4 to 4097 (0x1001 = the XPC "couldn't launch the helper" error): `inherit`
        # is for XPC SERVICES that adopt their parent's sandbox, and on an APP EXTENSION — which
        # gets its own — it makes the sandbox invalid, so the process dies at launch.
        com.apple.security.app-sandbox: true
    info:
      # Its OWN generated plist. project.yml generates AU/Info.plist for the iOS extension, and both
      # are xcodegen output (ios/.gitignore:12), so sharing the path means whichever spec ran last
      # wins — harmless while every build runs xcodegen first, a silent wrong-identity bug the moment
      # one doesn't.
      path: AU/Info-mac.plist
      properties:
        CFBundleDisplayName: Tiny Acid Jam
        NSExtension:
          # -UI, not plain com.apple.AudioUnit: that is what tells the system this extension HAS a
          # view, and the principal class must then be the AUViewController that also implements
          # AUAudioUnitFactory. With the plain identifier a host shows its own generic sliders.
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          # NOT $(PRODUCT_MODULE_NAME) any more: the class lives in the KERNEL framework's module, not
          # in the appex's. Using the appex's own module name here would make NSClassFromString fail
          # and the extension load with no principal class.
          NSExtensionPrincipalClass: TinyjamAUKernel.TinyjamAUViewController
          NSExtensionAttributes:
            # THE KEY THAT ENABLES IN-PROCESS LOADING. It must name a bundle the system can actually
            # load, i.e. the framework — pointing it at $(PRODUCT_BUNDLE_IDENTIFIER) (the .appex,
            # which is an executable) is accepted and then silently ignored: a host requesting
            # `.loadInProcess` got an out-of-process instance anyway, which is the orphaned panel.
            AudioComponentBundle: com.tinyjam.mac.AUKernel
            AudioComponents:
              # DISTINCT 4-char codes from the iOS spec's tnyj/Tnyj: the two can be registered on
              # one machine and a collision would make the host pick whichever it saw first.
              # auval addresses the AU by exactly this triple: `auval -v aumu tacj Mpla`.
              - type: aumu
                subtype: tacj
                manufacturer: Mpla
                name: "Mipolai: Tiny Acid Jam"
                version: 1
                sandboxSafe: true
                # The other half of in-process loading: the class inside AudioComponentBundle that
                # conforms to AUAudioUnitFactory. For an AUv3 WITH a view that is the view controller
                # itself, which is exactly what makes the panel and the DSP one object.
                factoryFunction: TinyjamAUKernel.TinyjamAUViewController
                tags:
                  - Synthesizer
schemes:
  TinyjamMac:
    build:
      targets:
        TinyjamMac: all
    run: {}
