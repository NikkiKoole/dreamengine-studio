# xcodegen spec — the ONLY hand-edited project file. `./build.sh` regenerates the
# .xcodeproj from this (never open Xcode to manage files). Add a target / source
# folder here; commit this, never the generated .xcodeproj (it's .gitignore'd).
name: TinyjamHello
options:
  bundleIdPrefix: com.tinyjam
  deploymentTarget:
    iOS: "15.0"
targets:
  TinyjamHello:
    type: application
    platform: iOS
    # Phase 2: the REAL dreamengine. The app compiles studio.c + raylib_compat.c (the
    # DE_NO_RAYLIB software path) + whatever is staged in gen/app/. The spike stand-ins
    # canvas.c/audio.c that this used to exclude by name now live in ios/history/, so
    # `path: Sources` cannot pick them up at all. gen/app is a DIRECTORY source so it
    # works for both shapes: a single cart (gen/app/cart.c, staged by play.js) OR a
    # MULTI-CART app (app_main.c dispatcher + per-cart <slug>.c wrappers, staged by
    # `build-app.js --ios`). build.sh / device.sh with APP=<name> pick the multi-cart path.
    sources:
      # Tinyjam.storekit is GENERATED from the app manifest into gen/app (build-app.js --ios);
      # exclude the hand-authored Sources copy so it isn't bundled twice.
      - path: Sources
        excludes: [Tinyjam.storekit]
      - path: ../runtime/studio.c
      - path: ../runtime/raylib_compat.c
      - path: gen/app
      # Per-app icon, staged by build-app.js --ios from the manifest's "icon" key (absent for
      # single-cart builds — optional means xcodegen just skips it then).
      - path: gen/Assets.xcassets
        optional: true
    # de:au-begin — AU embed; testflight.sh strips this block when the manifest sets no auCart (AU is opt-in, single-cart standalones ship without it)
    dependencies:
      - target: TinyjamAU       # embed the AUv3 extension into the app's PlugIns
        embed: true
    # de:au-end
    # NOTE: the app-group entitlement is re-added once the group is registered for automatic
    # provisioning. It blocks plain device signing until then, and the AppGroup UserDefaults
    # suite works without it. (Was: application-groups group.com.tinyjam.)
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # com.tinyjam.hello is the DEV-LOOP identity (throwaway, Xcode-auto-registered). The
        # SHIPPING id is apps/tinyjam/app.json's bundleId = com.mipolai.tinyjam — registered
        # manually in the developer portal + reserved on App Store Connect (2026-07-06). A
        # store/TestFlight build must set PRODUCT_BUNDLE_IDENTIFIER to that (extension:
        # com.mipolai.tinyjam.TinyjamAU) — don't ship the hello id.
        PRODUCT_BUNDLE_IDENTIFIER: com.tinyjam.hello
        # Inert unless gen/Assets.xcassets was staged (see sources) — no catalog, no actool run.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # no in-app encryption beyond OS-provided → auto-answers the ASC export-compliance
        # question, so TestFlight builds go straight to "Ready to Test" after processing
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # NO NSMicrophoneUsageDescription HERE. It used to be hardcoded, with pedalboard's guitar
        # wording, on every app built from this shared spec — so Tiny Acid Jam, which makes zero mic
        # calls, shipped a purpose string for a capability it does not have. It is now DERIVED:
        # build-app.js reads the app's carts for mic_start(), writes DE_MIC_USAGE into gen/app.dims
        # only when one of them opens the mic, and ios/app-flags.sh turns that into the key. An app
        # that needs it cannot be built without wording (the crash direction — iOS terminates an app
        # that asks for the mic with no string), and an app that does not need it emits nothing.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # device-adaptive Phase 2: allow rotation. layoutSubviews fires on rotate → de_resize reflows
        # a resizable cart to the new shape for free. (Fixed carts just re-letterbox in the new bounds.)
        # all four incl. upside-down: App Store validation REQUIRES the full set when the app
        # targets iPad (multitasking rule) — upload rejects otherwise (hit 2026-07-06)
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
        # the engine sees its headers (runtime/) + the staged cart data (gen/app/)
        HEADER_SEARCH_PATHS: [$(SRCROOT)/../runtime, $(SRCROOT)/gen/app, $(SRCROOT)/Sources]
        # StoreKit LOCAL testing is SIMULATOR-ONLY: StoreKitTest.framework pulls in XCTest,
        # which isn't present in a plain app launch (esp. on a real device → dyld crash). So
        # link it + add the platform Developer-frameworks rpath ONLY for the simulator SDK; the
        # device build stays clean (device IAP testing = App Store Connect sandbox, later).
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": [-framework, StoreKitTest]
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphonesimulator*]": [$(inherited), $(PLATFORM_DIR)/Developer/Library/Frameworks]
        # SCALE=1 so UIKit touches map 1:1 to framebuffer pixels. The CART DIMS
        # (SCREEN_W/H, MAP_W/H, CELL_W/H) are NOT set here: the build scripts pass them per-cart
        # on the xcodebuild command line, and studio.h's #ifndef fallbacks (320x200/128x64/16x16)
        # cover a bare Xcode-GUI build. Keeping them here made $(inherited) re-add the 320x200
        # base on TOP of the script's override → a "SCREEN_W macro redefined" warning every build.
        GCC_PREPROCESSOR_DEFINITIONS: [$(inherited), DE_NO_RAYLIB=1, SCALE=1]
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  # de:au-begin
  TinyjamAU:
    type: app-extension
    platform: iOS
    # The AUv3 rack hosts the REAL engine (not the spike arpeggio): studio.c + raylib_compat.c
    # + a keybed instrument cart (gen/au/cart.c = epiano). TinyjamAU.swift's render block feeds
    # host MIDI (de_midi_event) → the cart's keybed plays it, sample-clocks de_frame() (the
    # sequencer/voice bookkeeping), and pulls de_audio_render() — same engine the app runs.
    sources:
      # THE PANEL IS IN (2026-08-14). This target used to EXCLUDE the view controller and declare
      # plain `com.apple.AudioUnit`, so the iOS plug-in had no interface at all and a host drew its
      # own generic sliders — a different, lesser product from the macOS one, which nobody noticed
      # because store builds strip this target (de:au-begin) and nothing else built it. The mac
      # extension (project-mac.yml) is the worked example and this now mirrors it.
      - path: AU
      # the plug-in's VIEW is the SAME CanvasView the standalone app uses (hosted: true = blit-only)
      - Sources/CanvasView.swift
      - ../runtime/studio.c
      - ../runtime/raylib_compat.c
      - gen/au/cart.c
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.tinyjam.hello.TinyjamAU
        SWIFT_OBJC_BRIDGING_HEADER: AU/AU-Bridging-Header.h
        HEADER_SEARCH_PATHS: [$(SRCROOT)/../runtime, $(SRCROOT)/gen/au, $(SRCROOT)/Sources]
        # cart dims come from the build scripts' command-line override (+ studio.h #ifndef
        # fallbacks for a bare GUI build) — not baked here, so $(inherited) can't re-add a stale
        # SCREEN_W over the override (the "macro redefined" warning). See the app target above.
        GCC_PREPROCESSOR_DEFINITIONS: [$(inherited), DE_NO_RAYLIB=1, SCALE=1]
        # AU_EXT keeps the APP's AVAudioEngine/mic plumbing out of the extension, which never owns
        # audio — the host does. CanvasView guards that plumbing with `#if !AU_EXT`, so without this
        # the shared view drags the whole app audio stack in and does not build.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: [$(inherited), AU_EXT]
        OTHER_CFLAGS: [-fno-modules]   # the curses echo()/filter() collision — see the app target
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: AU/Info.plist
      properties:
        CFBundleDisplayName: Tinyjam Demo
        # ⚠ THESE TWO MUST BE HERE, and must be the $(…) forms. The APP target uses
        # GENERATE_INFOPLIST_FILE, so testflight.sh's `CURRENT_PROJECT_VERSION=<build no>` on the
        # xcodebuild command line reaches it. This target has a HAND-SPECIFIED plist, and xcodegen
        # fills any version key the spec omits with a literal default — CFBundleVersion: 1 — which
        # no command-line setting can then override, because it is a literal in the file rather
        # than a reference. Result: the app shipped as build 202608162137 with its own extension
        # stamped build 1, and Apple bounced the delivery with
        #   ITMS-90473: CFBundleVersion Mismatch — '1' of extension TinyjamAU.appex does not match
        #   '202608162137' of its containing application
        # (a warning, not a rejection — the build still validated, which is exactly why nobody
        # noticed until the email arrived). Referencing the build settings makes the extension
        # inherit whatever the app is stamped with, forever.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          # -UI, not plain com.apple.AudioUnit: that is what tells the system this extension HAS a
          # view, and the principal class must then be the AUViewController that also implements
          # AUAudioUnitFactory. With the plain identifier a host shows its own generic sliders —
          # which is exactly what iOS did until 2026-08-14.
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TinyjamAUViewController
          NSExtensionAttributes:
            AudioComponentBundle: $(PRODUCT_BUNDLE_IDENTIFIER)
            AudioComponents:
              - type: aumu
                subtype: tnyj
                manufacturer: Tnyj
                name: "Tinyjam: Demo"
                version: 1
                sandboxSafe: true
                tags:
                  - Synthesizer
  # de:au-end
  TinyjamHelloTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TinyjamHello
      - sdk: StoreKitTest.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tinyjam.hello.tests
schemes:
  TinyjamHello:
    build:
      targets:
        TinyjamHello: all
    run: {}
    test:
      targets:
        - TinyjamHelloTests
